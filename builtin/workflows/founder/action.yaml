name: founder
description: >-
  Founder judgment on a decision, design, or piece of work: a plain GO / REFINE /
  REJECT with the take, what it rests on, the rule that decided it, and the traps
  to avoid. Judgment mode when the request points at a concrete artifact to ground
  on; advice mode for an abstract "how should we…" call with no artifact yet.
  Founder output never asks a human — thin grounding returns REFINE with the
  missing piece named, never a bounced question.

args:
  request:
    required: true
    description: >-
      The decision, artifact, or question to judge. Name a file/diff/plan to get
      artifact-grounded judgment; ask an abstract "how should we…" for advice.

# Two steps, one lane. The judge emits the five-header MARKDOWN
# contract as plain text — deliberately NO structured output, so the cheapest
# models can run the lane. A separate deterministic
# command step parses that text into the verdict object; a parse failure is an
# honest workflow failure (exit 1), never a guessed verdict.
steps:
  # `skills.only: [founder]` force-pops the founder doctrine's full body into this
  # agent's instructions (compile.ts resolvePoppedSkills) so a small model is never
  # left to sporadically discover it. The pluggable persona comes free from tier
  # precedence — a consumer's `.navi/skills/founder` shadows the builtin, no special
  # wiring. Explicit read-only `tools:` (READ_ONLY_WORKSPACE_TOOLS in
  # workspace-tools.ts — absent tools: now means ZERO, not all): judgment mode
  # reads the artifact when the verdict rests on evidence it lacks; shell is
  # excluded so the lane cannot execute_command. The
  # vendored-code guard still fences node_modules/external.
  - name: judge
    type: agent
    tools: [view, search_content, find_files, mastra_workspace_file_stat]
    skills:
      only: [founder]
    # No step-local reasoningEffort: the flow must run on every provider navi
    # supports. The managed DeepSeek v4 defaults still apply centrally through
    # src/mastra/model-settings.ts (temperature 0 + thinking enabled); other
    # providers keep their native defaults instead of receiving a DeepSeek-only
    # option.
    prompt: |
      You are giving founder judgment. Your doctrine and rubrics are loaded in
      your instructions above — apply them. Lead with the decision, not the
      framework.

      Request under judgment:
      {{ input.request }}

      First settle the mode:

      - JUDGMENT mode — the request points at a concrete artifact you can
        actually read (a file path, a diff, a plan section, a command result).
        Read that artifact and ground the verdict on what it literally says.
        Keep evidence you observed separate from doctrine. Reach for wider repo
        search only when the verdict truly rests on evidence you do not yet
        have — not to look thorough.
      - ADVICE mode — an abstract "how should we…" question with no artifact.
        Answer from doctrine and reasoning only. Do NOT go searching the repo
        just because a file or a framework is named, and NEVER cite a file:line
        you did not read.

      When you make a claim about code, cite the file:line you actually read; if
      you did not read it, frame it as an assumption, never state it as fact. If
      a number is not in the request, the artifact, or evidence you actually
      gathered, do not present it as fact.

      Never ask a human a question, never request confirmation, never stall for
      input. If grounding is too thin to say GO, return REFINE and name exactly
      what is missing — do not bounce it back.

      Emit ONLY the verdict, as plain markdown with EXACTLY these five headers,
      each present once, in this order. Write NOTHING before the first header —
      no preamble, no narration of your process, no code fences:

      ## Verdict
      ## Take
      ## Grounding points
      ## Decision rules
      ## What not to do

      ## Verdict is exactly one of GO, REFINE, or REJECT. ## Take is one plain
      sentence: the decision and its spine. The three list sections are tight
      bullets — for REFINE or REJECT they name the concrete fix or the concrete
      failure, not a generic caution.

  # The deterministic parser receives the emission through the command step's
  # stdin channel, so model text never enters the shell command string. The
  # parser's stdout is this step's — and therefore the run's — final
  # output, so the verdict JSON rides in envelope.result.stdout.
  - name: parse
    type: command
    depends: judge
    command: node "$NAVI_ACTION_DIR/parse-verdict.mjs"
    stdin: |
      {{ steps.judge.text }}
