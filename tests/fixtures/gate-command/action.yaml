name: gate-command
description: >-
  Model-free fixture whose single final step echoes a GateDecision-shaped JSON on
  stdout (the gate selected by the `gate` arg, or by input.gate under --stdin),
  carrying a valid sibling directive, finding, and surface_map. Exercises the CLI's
  shape-keyed whisper path end to end with NO model call: GateDecision detection,
  gate-derived exit (0/2/3 via exitForGate), the gate-aware next block, the liberal
  sibling extraction, and SessionState persistence — the whole loop provable keyless.

args:
  gate:
    required: false
    default: DIRECT
    description: Which gate the emitted GateDecision carries (CLEAR|DIRECT|REPAIR|BLOCKED|ESCALATE|COMPLETE).

